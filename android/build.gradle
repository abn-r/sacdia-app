allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)
subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
// Some plugins still hardcode an old compileSdk (secure_application 31,
// image_cropper 33, home_widget/jni 35). AGP 9 rejects a library compiled
// against a lower SDK than its dependencies need (checkReleaseAarMetadata), so
// any Android library module below 36 is raised to 36. Modules that already
// ask for more (permission_handler_android 14 needs 37) keep their value.
// The app itself compiles against 37 (see app/build.gradle).
// compileSdk only picks the API surface used to compile; it does not change
// minSdk or targetSdk.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library")) {
            def current = project.android.compileSdk
            if (current == null || current < 36) {
                project.android.compileSdk = 36
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
