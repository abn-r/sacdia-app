name: CI

# Flutter 3.47.9 (stable, 2026-10-29) — pinned to match the Dart SDK ^3.6.1
# constraint in pubspec.yaml. Update flutter-version when bumping the SDK floor.

on:
  push:
    branches: [main, preproduction, development]
  pull_request:
    branches: [main, preproduction, development]

# A new push to the same PR cancels the run it supersedes. Pushes to the
# long-lived branches always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Analyze, the test shards and the Android build run in parallel: none of them
# needs another's result, so the wall clock is the slowest job, not the sum.
jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 0: Changed paths
  # ──────────────────────────────────────────────────────────────────────────
  # The release APK only needs rebuilding in CI when something that can break
  # the native build changed: the Android/iOS projects, dependencies or this
  # workflow. Pushes to main/preproduction/development always build it.
  # ──────────────────────────────────────────────────────────────────────────
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -Eq '^(android/|ios/|pubspec\.(yaml|lock)$|\.github/workflows/)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Analyze & Format
  # ──────────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Dart format check
        run: dart format --set-exit-if-changed --output=none .

      - name: Flutter analyze
        # --no-fatal-warnings / --no-fatal-infos: only exit non-zero on errors.
        # info/warning issues are reported but do not fail the build.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Tests
  # ──────────────────────────────────────────────────────────────────────────
  # The suite (~3800 tests) is split across shards that run in parallel.
  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Split by file, not with --total-shards: that flag splits test cases, so
      # every shard would still compile and load every test file, which is
      # most of the time.
      - name: Run unit tests
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 3
        run: |
          mapfile -t files < <(find test -name '*_test.dart' | sort | awk -v s="$SHARD" -v n="$SHARDS" '(NR - 1) % n == s')
          echo "Shard $SHARD: ${#files[@]} test files"
          flutter test --no-pub "${files[@]}"

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: Check Secrets
  # ──────────────────────────────────────────────────────────────────────────
  # Job-level `if: env.X != ''` does NOT work in GH Actions — the job-level
  # env block is evaluated AFTER the if expression, so the secret is always
  # seen as empty string and the workflow file is flagged as invalid.
  # Solution: a tiny job reads the secret inside a step (where env IS
  # available) and publishes the result as an output. build-android then
  # conditions on `needs.check-secrets.outputs.has_google_services == 'true'`.
  # ──────────────────────────────────────────────────────────────────────────
  check-secrets:
    name: Check Secrets
    runs-on: ubuntu-latest
    outputs:
      has_google_services: ${{ steps.check.outputs.has_google_services }}
      has_release_keystore: ${{ steps.check.outputs.has_release_keystore }}
      has_sentry_token: ${{ steps.check.outputs.has_sentry_token }}
      has_api_base_url: ${{ steps.check.outputs.has_api_base_url }}
    steps:
      - id: check
        env:
          GS_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -n "$GS_SECRET" ]; then
            echo "has_google_services=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_google_services=false" >> "$GITHUB_OUTPUT"
          fi
          # Release signing requires the full set of keystore secrets.
          if [ -n "$KEYSTORE_SECRET" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "has_release_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_keystore=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$SENTRY_TOKEN" ]; then
            echo "has_sentry_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sentry_token=false" >> "$GITHUB_OUTPUT"
          fi
          # Empty → skip Android (no crash-on-boot APK). Non-HTTPS → fail CI.
          if [ -z "$API_BASE_URL" ]; then
            echo "has_api_base_url=false" >> "$GITHUB_OUTPUT"
          else
            case "$API_BASE_URL" in
              https://*) echo "has_api_base_url=true" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "ERROR: secret API_BASE_URL must start with https://" >&2
                exit 1
                ;;
            esac
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3b: Validate API_BASE_URL
  # ──────────────────────────────────────────────────────────────────────────
  # Release builds crash on startup without an HTTPS API_BASE_URL dart-define
  # (see lib/core/constants/app_constants.dart). Fail fast here instead of
  # shipping a broken binary. Requires repo secret API_BASE_URL, e.g.
  # https://api.sacdia.com/api/v1
  # ──────────────────────────────────────────────────────────────────────────
  check-api-base-url:
    name: Validate API_BASE_URL
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.has_google_services == 'true' && needs.check-secrets.outputs.has_api_base_url == 'true'
    steps:
      - env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: echo "API_BASE_URL OK"

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4: Build Android (APK smoke gate)
  # ──────────────────────────────────────────────────────────────────────────
  # Requires repo secret GOOGLE_SERVICES_JSON_BASE64 (base64-encoded content
  # of android/app/google-services.json). The job is skipped cleanly when the
  # secret is absent so forks and PRs without secret access still pass CI.
  #
  # One-time setup (repo admin):
  #   base64 -i android/app/google-services.json | pbcopy   # macOS
  #   # Paste into Settings > Secrets > Actions > GOOGLE_SERVICES_JSON_BASE64
  # ──────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [changes, check-secrets, check-api-base-url]
    if: needs.changes.outputs.android == 'true' && needs.check-secrets.outputs.has_google_services == 'true' && needs.check-secrets.outputs.has_api_base_url == 'true'
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle distribution, plugins and resolved dependencies. Saved from runs
      # on the long-lived branches; PRs restore the cache of their base branch.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle', 'android/build.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          # --ignore-garbage skips non-base64-alphabet chars (whitespace, tabs, etc)
          # making the decode tolerant of any encoder's output.
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode --ignore-garbage > android/app/google-services.json
          # Sanity check: the decoded file should be valid JSON
          if ! python3 -c "import json; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
            echo "ERROR: Decoded google-services.json is not valid JSON. Check the secret content." >&2
            echo "Decoded file size: $(wc -c < android/app/google-services.json) bytes" >&2
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────────
      # Release keystore (optional): when the ANDROID_KEYSTORE_* secrets are
      # configured the build is signed with the real upload key and an AAB is
      # produced; otherwise the job stays an APK smoke gate signed with the
      # debug keystore (never publishable). See android/KEYSTORE.md.
      #
      # One-time setup (repo admin):
      #   base64 -i ~/sacdia-release-key.jks | pbcopy   # → ANDROID_KEYSTORE_BASE64
      #   + ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS
      # ──────────────────────────────────────────────────────────────────────
      - name: Set up release keystore
        if: needs.check-secrets.outputs.has_release_keystore == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > android/release-key.jks
          cat > android/key.properties <<EOF
          storeFile=release-key.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build APK (release)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_GRADLE_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          # Pass GOOGLE_MAPS_API_KEY both as a dart-define (for Static Maps REST)
          # and as a gradle property (for the interactive Maps SDK manifest placeholder).
          # API_BASE_URL is mandatory for release builds: without it the app
          # throws on startup (see AppConstants.resolveBaseUrl).
          flutter build apk --release \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY}" \
            -P GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_GRADLE_KEY}"

      - name: Build AAB (signed, obfuscated)
        if: needs.check-secrets.outputs.has_release_keystore == 'true'
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_GRADLE_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          # Play Store artifact: signed with the upload key, Dart obfuscation on,
          # split-debug-info symbols kept for Sentry symbolication.
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY}" \
            -P GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_GRADLE_KEY}"

      - name: Upload debug symbols to Sentry
        if: needs.check-secrets.outputs.has_release_keystore == 'true' && needs.check-secrets.outputs.has_sentry_token == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: dart run sentry_dart_plugin

      - name: Upload AAB artifact
        if: needs.check-secrets.outputs.has_release_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Clean up keystore
        if: always() && needs.check-secrets.outputs.has_release_keystore == 'true'
        run: rm -f android/release-key.jks android/key.properties
